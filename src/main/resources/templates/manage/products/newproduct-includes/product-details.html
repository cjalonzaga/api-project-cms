<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
	<div class="row" th:fragment="product-details">
		<div class="col-3 border-end">
	        <ul class="nav flex-column nav-pills" id="productTabs" role="tablist">
	          <li class="nav-item">
	            <a class="nav-link active"
	               id="general-tab"
	               data-coreui-toggle="tab"
	               href="#general"
	               role="tab">
	               <i class="fa-solid fa-tag"></i>
	              General
	            </a>
	          </li>
	
	          <li class="nav-item">
	            <a class="nav-link"
	               id="inventory-tab"
	               data-coreui-toggle="tab"
	               href="#inventory"
	               role="tab">
	               <i class="fa-solid fa-barcode"></i>
	              Inventory
	            </a>
	          </li>
	
	          <li class="nav-item">
	            <a class="nav-link"
	               id="shipping-tab"
	               data-coreui-toggle="tab"
	               href="#shipping"
	               role="tab">
	               <i class="fa-solid fa-truck-fast"></i>
	              Shipping
	            </a>
	          </li>
	
	          <li class="nav-item">
	            <a class="nav-link"
	               id="attributes-tab"
	               data-coreui-toggle="tab"
	               href="#attributes"
	               role="tab">
	               <i class="fa-solid fa-receipt"></i>
	              Attributes
	            </a>
	          </li>
	
	        </ul>
	    </div>
	    
	    <div class="col-9">

        <div class="tab-content" id="productTabsContent">

          <div class="tab-pane fade show active"
               id="general"
               role="tabpanel">

            <h5>General</h5>
            <div class="row g-3 align-items-center">
			  <div class="col-md-2">
			    <label for="regularPrice" class="col-form-label">Regular Price</label>
			  </div>
			  <div class="col-auto">
			    <input class="form-control mb-2" placeholder="Regular price" required th:field="*{price}">
			  </div>
			</div>
			
			<div class="row g-3 align-items-center">
			  <div class="col-md-2">
			    <label for="salePrice" class="col-form-label">Sales Price</label>
			  </div>
			  <div class="col-auto">
			    <input class="form-control" placeholder="Sale price">
			  </div>
			</div>
			
          </div>

          <div class="tab-pane fade"
               id="inventory"
               role="tabpanel">

            <h5>Inventory</h5>
            <div class="row g-3 align-items-center">
			  <div class="col-md-2">
			    <label for="sku" class="col-form-label">SKU</label>
			  </div>
			  <div class="col-auto">
			    <input type="text" class="form-control mb-2" placeholder="SKU" >
			  </div>
			</div>
            
            <div class="row g-3 align-items-center">
			  <div class="col-md-2">
			    <label for="stock" class="col-form-label">Stocks</label>
			  </div>
			  <div class="col-auto">
			    <input type="number" class="form-control" placeholder="Stocks" >
			  </div>
			</div>
            
          </div>

          <div class="tab-pane fade"
               id="shipping"
               role="tabpanel">

            <h5>Shipping</h5>
            
            <div class="row g-3 align-items-center">
			  <div class="col-md-2">
			    <label for="weight" class="col-form-label">Stocks</label>
			  </div>
			  <div class="col-auto">
			    <input class="form-control mb-2" placeholder="Weight">
			  </div>
			</div>
			
			<div class="row g-3 align-items-center">
			  <div class="col-md-2">
			    <label for="weight" class="col-form-label">Dimension</label>
			  </div>
			  <div class="col-auto">
			    <input type="number"  class="form-control" placeholder="L">
			  </div>
			  <div class="col-auto">
			    <input type="number"  class="form-control" placeholder="W">
			  </div>
			  <div class="col-auto">
			    <input type="number" class="form-control" placeholder="H">
			  </div>
			</div>
			
          </div>

          <div class="tab-pane fade"
               id="attributes"
               role="tabpanel">

            <h5>Attributes</h5>
          </div>

        </div>

      </div>
	    
	</div>
</body>
</html>
